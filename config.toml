baseURL = 'https://deftdevs.com'
title = 'Deft Devs'
locale = 'en-US'
defaultcontentlanguage = "en"

# No blog (yet): don't generate empty tag/category/series/author pages or RSS feeds
disableKinds = ["taxonomy", "term", "rss"]

[pagination]
  pagerSize = 20

[markup.highlight]
style = "github-dark"

[params]
  author = "Deft Devs"
  info = "DevOps Excellence. Sustainably Delivered."
  description = "Deft Devs is an independent DevOps, platform and AI engineering consultancy: audit-ready release pipelines, dependency and supply-chain automation, exit-ready cloud platforms, and AI features taken to production."
  keywords = "devops,platform engineering,ai engineering,llm integration,ci/cd,release management,software supply chain,renovate,kubernetes,infrastructure as code,cloud exit strategy,eu dora,cyber resilience act,nis2,consulting"
  logo = "images/logo-mixed.png"
  since = 2022

  favicon_16 = "images/favicon-16.png"
  favicon_32 = "images/favicon-32.png"

