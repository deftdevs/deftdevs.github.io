baseURL = 'https://deftdevs.com'
title = 'Deft Devs'
languageCode = 'en-us'
theme = "hugo-coder"
defaultcontentlanguage = "en"

# No blog (yet): don't generate empty tag/category/series/author pages or RSS feeds
disableKinds = ["taxonomy", "term", "rss"]

[pagination]
  pagerSize = 20

[markup.highlight]
style = "github-dark"

[params]
  author = "Deft Devs"
  info = "DevOps Excellence. Sustainably Delivered."
  description = "Deft Devs is a DevSecOps consultancy: cloud architecture on Azure with Terraform, Kubernetes platforms, CI/CD automation and hands-on software engineering."
  keywords = "devops,devsecops,consulting,cloud,azure,terraform,kubernetes,ci/cd,software development"
  avatarurl = "images/logo-mixed.png"
  since = 2022

  favicon_16 = "images/favicon-16.png"
  favicon_32 = "images/favicon-32.png"

  colorScheme = "auto"
  hidecolorschemetoggle = false

  customCSS = ["custom.css"]

